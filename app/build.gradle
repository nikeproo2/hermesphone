plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nikeproo2.hermeswidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.nikeproo2.hermeswidget"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    signingConfigs {
        release {
            // Постоянный ключ: обновления ставятся поверх без удаления приложения.
            // Репозиторий приватный, ключ лежит в нём осознанно.
            storeFile rootProject.file('release.keystore')
            storePassword 'hermeswidget'
            keyAlias 'hermes'
            keyPassword 'hermeswidget'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
