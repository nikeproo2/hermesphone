name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        run: ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-widget-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to repo
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/next-lesson-widget.apk
          ls -la dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/next-lesson-widget.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to publish"
          else
            git commit -m "CI: publish APK [skip ci]"
            git push
          fi
